<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Social Spinner</title>
<style>
  :root {
    --bg: #0f1226;
    --bg-2: #1a1f3a;
    --fg: #f5f3ff;
    --muted: #a4a8c4;
    --accent: #ffd166;
    --danger: #ef476f;
    --ok: #06d6a0;
    --card: #1c2142;
    --border: rgba(255,255,255,0.08);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(1200px 600px at 20% -10%, #2a1f4a 0%, transparent 60%),
      radial-gradient(900px 500px at 110% 20%, #1f3a4a 0%, transparent 55%),
      var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  header {
    text-align: center;
    padding: 28px 16px 0;
  }
  header h1 {
    margin: 0;
    font-size: 28px;
    letter-spacing: -0.02em;
  }
  header p {
    margin: 6px 0 0;
    color: var(--muted);
    font-size: 14px;
  }

  /* ---- Tab navigation ---- */
  .tabs {
    display: flex;
    justify-content: center;
    gap: 4px;
    padding: 20px 16px 0;
  }
  .tab-btn {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-bottom: none;
    color: var(--muted);
    padding: 10px 28px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    border-radius: 12px 12px 0 0;
    transition: color 120ms, background 120ms;
  }
  .tab-btn.active {
    background: var(--card);
    color: var(--fg);
    border-color: rgba(255,255,255,0.14);
  }
  .tab-divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 0;
  }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* ---- Shared card / form styles ---- */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
  }
  input[type="text"] {
    flex: 1;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--fg);
    padding: 10px 12px;
    font-size: 15px;
    outline: none;
    min-width: 0;
  }
  input[type="text"]:focus { border-color: var(--accent); }
  .btn-add {
    background: var(--ok);
    color: #003b2c;
    border: none;
    border-radius: 10px;
    padding: 0 16px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    height: 40px;
  }
  .btn-add:hover { opacity: 0.9; }
  .empty {
    color: var(--muted);
    font-style: italic;
    text-align: center;
    padding: 20px 0;
  }
  .status {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    padding: 12px 16px 24px;
  }
  .status.error { color: var(--danger); }
  .setup-banner {
    max-width: 720px;
    margin: 24px auto;
    padding: 20px;
    background: #2a1f00;
    border: 1px solid var(--accent);
    border-radius: 12px;
    color: var(--accent);
    font-size: 14px;
    line-height: 1.5;
  }
  .setup-banner code {
    background: rgba(0,0,0,0.35);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 13px;
  }

  /* ---- Spinner tab ---- */
  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 16px;
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 24px;
  }
  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; }
  }
  .wheel-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  .wheel-stage {
    position: relative;
    width: 100%;
    max-width: 480px;
    aspect-ratio: 1 / 1;
  }
  canvas#wheel {
    width: 100%;
    height: 100%;
    display: block;
    border-radius: 50%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.45), inset 0 0 0 6px rgba(255,255,255,0.05);
    background: #11142a;
  }
  .pointer {
    position: absolute;
    top: -2px; left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 14px solid transparent;
    border-right: 14px solid transparent;
    border-top: 24px solid var(--accent);
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));
    z-index: 2;
  }
  .hub {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 56px; height: 56px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #fff 0%, #b9b9d6 60%, #6a6f99 100%);
    box-shadow: 0 6px 14px rgba(0,0,0,0.5);
    z-index: 1;
  }
  button.spin {
    background: linear-gradient(180deg, #ffd166 0%, #f0a93b 100%);
    color: #2a1f00;
    border: none;
    padding: 14px 28px;
    border-radius: 999px;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(255,209,102,0.35);
    transition: transform 80ms ease;
  }
  button.spin:active { transform: scale(0.97); }
  button.spin:disabled { opacity: 0.5; cursor: not-allowed; }
  .result {
    min-height: 28px;
    text-align: center;
    font-size: 18px;
    font-weight: 600;
  }
  .result .winner { color: var(--ok); }
  .panel h2 {
    margin: 0 0 12px;
    font-size: 16px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
  }
  form.add-idea {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }
  ul.ideas {
    list-style: none;
    padding: 0;
    margin: 0;
    max-height: 360px;
    overflow-y: auto;
  }
  ul.ideas li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    margin-bottom: 8px;
    background: var(--bg-2);
  }
  ul.ideas li button {
    background: transparent;
    color: var(--danger);
    border: none;
    font-size: 18px;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 6px;
  }
  ul.ideas li button:hover { background: rgba(239,71,111,0.12); }

  /* ---- Hosting tab ---- */
  .hosting-wrap {
    max-width: 960px;
    margin: 0 auto;
    padding: 20px 16px 40px;
  }
  .hosting-top {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .hosting-top h2 {
    margin: 0;
    font-size: 18px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.07em;
    flex: 0 0 auto;
  }
  .new-topic-form {
    display: flex;
    gap: 8px;
    flex: 1;
    min-width: 220px;
  }
  .topics-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
  }
  @media (max-width: 600px) {
    .topics-grid { grid-template-columns: 1fr; }
  }

  /* Topic card */
  .topic-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .topic-card-header {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .topic-title {
    flex: 1;
    font-size: 17px;
    font-weight: 700;
    color: var(--fg);
    word-break: break-word;
  }
  .topic-title-input {
    flex: 1;
    background: var(--bg-2);
    border: 1px solid var(--accent);
    border-radius: 8px;
    color: var(--fg);
    padding: 6px 10px;
    font-size: 15px;
    font-weight: 700;
    outline: none;
    min-width: 0;
  }
  .icon-btn {
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 4px 7px;
    border-radius: 6px;
    font-size: 15px;
    color: var(--muted);
    transition: background 120ms, color 120ms;
    line-height: 1;
    flex-shrink: 0;
  }
  .icon-btn:hover { background: rgba(255,255,255,0.08); color: var(--fg); }
  .icon-btn.danger { color: var(--danger); }
  .icon-btn.danger:hover { background: rgba(239,71,111,0.12); }

  /* Next button */
  .next-btn {
    width: 100%;
    background: linear-gradient(180deg, var(--accent) 0%, #f0a93b 100%);
    color: #2a1f00;
    border: none;
    padding: 10px 0;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 120ms;
  }
  .next-btn:hover { opacity: 0.88; }
  .next-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  /* Add name form inside a topic */
  .add-name-form {
    display: flex;
    gap: 8px;
  }

  /* Names list */
  ul.names-list {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  ul.names-list li {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 10px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg-2);
    transition: border-color 200ms, background 200ms;
  }
  ul.names-list li.current {
    border-color: var(--ok);
    background: rgba(6,214,160,0.08);
  }
  .name-text {
    flex: 1;
    font-size: 15px;
    word-break: break-word;
  }
  ul.names-list li.current .name-text {
    color: var(--ok);
    font-weight: 700;
  }
  .current-badge {
    font-size: 11px;
    background: var(--ok);
    color: #003b2c;
    padding: 2px 8px;
    border-radius: 999px;
    font-weight: 700;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .move-btns {
    display: flex;
    flex-direction: column;
    gap: 1px;
    flex-shrink: 0;
  }
  .move-btn {
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 1px 5px;
    border-radius: 4px;
    font-size: 11px;
    color: var(--muted);
    line-height: 1.4;
    transition: background 100ms, color 100ms;
  }
  .move-btn:hover:not(:disabled) { background: rgba(255,255,255,0.09); color: var(--fg); }
  .move-btn:disabled { opacity: 0.2; cursor: default; }
</style>
</head>
<body>

<header>
  <h1>🎡 Social Spinner</h1>
  <p>Add an idea, spin the wheel, go do the thing.</p>
</header>

<!-- Tab navigation -->
<nav class="tabs" role="tablist">
  <button class="tab-btn active" data-tab="spinner" role="tab" aria-selected="true">🎡 Spinner</button>
  <button class="tab-btn" data-tab="hosting" role="tab" aria-selected="false">🏠 Whose Hosting Anyway?</button>
</nav>
<hr class="tab-divider" />

<!-- ===================== SPINNER TAB ===================== -->
<div id="tab-spinner" class="tab-content active">
  <main>
    <section class="card wheel-wrap">
      <div class="wheel-stage">
        <div class="pointer"></div>
        <canvas id="wheel" width="800" height="800"></canvas>
        <div class="hub"></div>
      </div>
      <button class="spin" id="spinBtn">Spin the wheel</button>
      <div class="result" id="result"></div>
    </section>

    <aside class="card panel">
      <h2>Ideas</h2>
      <form class="add-idea" id="addForm">
        <input type="text" id="addInput" placeholder="e.g. Pizza &amp; board games" maxlength="60" required />
        <button class="btn-add" type="submit">Add</button>
      </form>
      <ul class="ideas" id="ideasList"></ul>
    </aside>
  </main>
</div>

<!-- ===================== HOSTING TAB ===================== -->
<div id="tab-hosting" class="tab-content">
  <div class="hosting-wrap">
    <div class="hosting-top">
      <h2>Topics</h2>
      <form class="new-topic-form" id="newTopicForm">
        <input type="text" id="newTopicInput" placeholder="New topic name…" maxlength="80" required />
        <button class="btn-add" type="submit">Create</button>
      </form>
    </div>
    <div class="topics-grid" id="topicsGrid">
      <div class="empty">Loading…</div>
    </div>
  </div>
</div>

<div class="status" id="status">Connecting…</div>

<script type="module">
  // ============================================================
  //  PASTE YOUR SUPABASE PROJECT VALUES HERE
  //  (Both are safe for browser use — the anon key is public.)
  // ============================================================
  const SUPABASE_URL     = "https://ngocbbgwpwmocmehyjeq.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5nb2NiYmd3cHdtb2NtZWh5amVxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyOTk5MjEsImV4cCI6MjA5Mjg3NTkyMX0.KSZ-STUeF6FO-SSOb3V-5kj919FuAccfp4m9ldIKlHQ";
  // ============================================================

  import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

  // ── Shared utilities ─────────────────────────────────────────
  function escapeHTML(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  const statusEl = document.getElementById("status");

  if (SUPABASE_URL.startsWith("YOUR_") || SUPABASE_ANON_KEY.startsWith("YOUR_")) {
    const banner = document.createElement("div");
    banner.className = "setup-banner";
    banner.innerHTML = `<strong>Almost there!</strong> Open <code>index.html</code> and replace
      <code>SUPABASE_URL</code> and <code>SUPABASE_ANON_KEY</code> with the values
      from your Supabase project (Settings → API).`;
    document.body.insertBefore(banner, document.querySelector(".tabs"));
    statusEl.textContent = "Waiting for Supabase keys.";
    statusEl.classList.add("error");
  }

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ── Tab switching ─────────────────────────────────────────────
  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".tab-btn").forEach(b => {
        b.classList.remove("active");
        b.setAttribute("aria-selected", "false");
      });
      document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
      btn.classList.add("active");
      btn.setAttribute("aria-selected", "true");
      document.getElementById("tab-" + btn.dataset.tab).classList.add("active");
    });
  });

  // ═══════════════════════════════════════════════════════════════
  //  SPINNER TAB
  // ═══════════════════════════════════════════════════════════════
  const listEl   = document.getElementById("ideasList");
  const formEl   = document.getElementById("addForm");
  const inputEl  = document.getElementById("addInput");
  const spinBtn  = document.getElementById("spinBtn");
  const resultEl = document.getElementById("result");
  const canvas   = document.getElementById("wheel");
  const ctx      = canvas.getContext("2d");

  let ideas = [];
  let currentAngle = 0;
  let spinning = false;

  function colourFor(i, n) {
    return `hsl(${(i * 360) / Math.max(n, 1)}, 70%, 55%)`;
  }

  function drawWheel() {
    const W = canvas.width, H = canvas.height;
    const cx = W / 2, cy = H / 2, r = Math.min(cx, cy) - 8;
    ctx.clearRect(0, 0, W, H);

    if (ideas.length === 0) {
      ctx.fillStyle = "#11142a";
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#a4a8c4";
      ctx.font = "600 28px -apple-system, system-ui, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("Add some ideas", cx, cy - 16);
      ctx.fillText("to get started →", cx, cy + 22);
      return;
    }

    const n = ideas.length;
    const slice = (Math.PI * 2) / n;

    for (let i = 0; i < n; i++) {
      const a0 = currentAngle + i * slice - Math.PI / 2;
      const a1 = a0 + slice;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, r, a0, a1);
      ctx.closePath();
      ctx.fillStyle = colourFor(i, n);
      ctx.fill();
      ctx.strokeStyle = "rgba(0,0,0,0.25)";
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(a0 + slice / 2);
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      ctx.fillStyle = "rgba(0,0,0,0.85)";
      ctx.font = "700 22px -apple-system, system-ui, sans-serif";
      const label = ideas[i].text.length > 24 ? ideas[i].text.slice(0, 23) + "…" : ideas[i].text;
      ctx.fillText(label, r - 18, 0);
      ctx.restore();
    }
  }

  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

  function spin() {
    if (spinning || ideas.length === 0) return;
    spinning = true;
    spinBtn.disabled = true;
    resultEl.textContent = "";

    const n = ideas.length;
    const slice = (Math.PI * 2) / n;
    const winnerIdx = Math.floor(Math.random() * n);
    const fullSpins = 5 + Math.random() * 2;
    const target = -winnerIdx * slice - slice / 2 + Math.PI * 2 * fullSpins;
    const start = currentAngle;
    const delta = target - (start % (Math.PI * 2));
    const duration = 4200;
    const t0 = performance.now();

    function frame(now) {
      const t = Math.min(1, (now - t0) / duration);
      currentAngle = start + delta * easeOutCubic(t);
      drawWheel();
      if (t < 1) {
        requestAnimationFrame(frame);
      } else {
        spinning = false;
        spinBtn.disabled = false;
        const winner = ideas[winnerIdx];
        resultEl.innerHTML = `🎉 <span class="winner">${escapeHTML(winner.text)}</span>`;
      }
    }
    requestAnimationFrame(frame);
  }

  spinBtn.addEventListener("click", spin);

  function renderIdeas() {
    listEl.innerHTML = "";
    if (ideas.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "No ideas yet. Add the first one!";
      listEl.appendChild(empty);
      return;
    }
    for (const idea of ideas) {
      const li = document.createElement("li");
      const span = document.createElement("span");
      span.textContent = idea.text;
      const btn = document.createElement("button");
      btn.textContent = "✕";
      btn.title = "Remove";
      btn.addEventListener("click", () => removeIdea(idea.id));
      li.appendChild(span);
      li.appendChild(btn);
      listEl.appendChild(li);
    }
  }

  async function loadIdeas() {
    const { data, error } = await supabase
      .from("ideas")
      .select("*")
      .order("created_at", { ascending: true });
    if (error) {
      statusEl.textContent = "Error loading ideas: " + error.message;
      statusEl.classList.add("error");
      return;
    }
    ideas = data || [];
    renderIdeas();
    drawWheel();
    statusEl.textContent = `Connected · ${ideas.length} idea${ideas.length === 1 ? "" : "s"}`;
    statusEl.classList.remove("error");
  }

  async function addIdea(text) {
    const { error } = await supabase.from("ideas").insert({ text });
    if (error) alert("Couldn't add: " + error.message);
  }

  async function removeIdea(id) {
    const { error } = await supabase.from("ideas").delete().eq("id", id);
    if (error) alert("Couldn't remove: " + error.message);
  }

  formEl.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = inputEl.value.trim();
    if (!text) return;
    inputEl.value = "";
    await addIdea(text);
  });

  // ═══════════════════════════════════════════════════════════════
  //  HOSTING TAB
  // ═══════════════════════════════════════════════════════════════
  let topics = [];
  let names  = [];

  function getNamesForTopic(topicId) {
    return names
      .filter(n => n.topic_id === topicId)
      .sort((a, b) => a.position - b.position);
  }

  function renderHosting() {
    const grid = document.getElementById("topicsGrid");
    if (!grid) return;
    grid.innerHTML = "";

    if (topics.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "No topics yet — create one above!";
      grid.appendChild(empty);
      return;
    }

    for (const topic of topics) {
      const topicNames = getNamesForTopic(topic.id);
      const card = document.createElement("div");
      card.className = "topic-card";

      // ── Header (title + rename + delete) ──
      const header = document.createElement("div");
      header.className = "topic-card-header";

      const titleSpan = document.createElement("span");
      titleSpan.className = "topic-title";
      titleSpan.textContent = topic.name;

      const renameBtn = document.createElement("button");
      renameBtn.className = "icon-btn";
      renameBtn.title = "Rename topic";
      renameBtn.textContent = "✏️";
      renameBtn.addEventListener("click", () => startRename(topic, titleSpan));

      const deleteTopicBtn = document.createElement("button");
      deleteTopicBtn.className = "icon-btn danger";
      deleteTopicBtn.title = "Delete topic";
      deleteTopicBtn.textContent = "🗑️";
      deleteTopicBtn.addEventListener("click", () => deleteTopic(topic.id, topic.name));

      header.append(titleSpan, renameBtn, deleteTopicBtn);

      // ── Next button ──
      const nextBtn = document.createElement("button");
      nextBtn.className = "next-btn";
      nextBtn.textContent = "▶ Next";
      nextBtn.disabled = topicNames.length === 0;
      nextBtn.addEventListener("click", () => advanceNext(topic.id));

      // ── Add name form ──
      const addForm = document.createElement("form");
      addForm.className = "add-name-form";
      const nameInput = document.createElement("input");
      nameInput.type = "text";
      nameInput.placeholder = "Add a name…";
      nameInput.maxLength = 60;
      nameInput.required = true;
      const addBtn = document.createElement("button");
      addBtn.className = "btn-add";
      addBtn.type = "submit";
      addBtn.textContent = "Add";
      addForm.append(nameInput, addBtn);
      addForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const name = nameInput.value.trim();
        if (!name) return;
        nameInput.value = "";
        await addName(topic.id, name, topicNames);
      });

      // ── Names list ──
      const ul = document.createElement("ul");
      ul.className = "names-list";

      if (topicNames.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "No names yet.";
        ul.appendChild(empty);
      } else {
        topicNames.forEach((n, idx) => {
          const li = document.createElement("li");
          if (n.is_current) li.classList.add("current");

          // Move up/down buttons
          const moveBtns = document.createElement("div");
          moveBtns.className = "move-btns";

          const upBtn = document.createElement("button");
          upBtn.className = "move-btn";
          upBtn.textContent = "▲";
          upBtn.title = "Move up";
          upBtn.disabled = idx === 0;
          upBtn.addEventListener("click", () => moveName(n.id, "up", topic.id));

          const downBtn = document.createElement("button");
          downBtn.className = "move-btn";
          downBtn.textContent = "▼";
          downBtn.title = "Move down";
          downBtn.disabled = idx === topicNames.length - 1;
          downBtn.addEventListener("click", () => moveName(n.id, "down", topic.id));

          moveBtns.append(upBtn, downBtn);

          // Name text
          const nameText = document.createElement("span");
          nameText.className = "name-text";
          nameText.textContent = n.name;

          // Current badge
          const badge = n.is_current ? (() => {
            const b = document.createElement("span");
            b.className = "current-badge";
            b.textContent = "Now";
            return b;
          })() : null;

          // Delete name button
          const delBtn = document.createElement("button");
          delBtn.className = "icon-btn danger";
          delBtn.textContent = "✕";
          delBtn.title = "Remove";
          delBtn.addEventListener("click", () => deleteName(n.id));

          li.append(moveBtns, nameText);
          if (badge) li.appendChild(badge);
          li.appendChild(delBtn);
          ul.appendChild(li);
        });
      }

      card.append(header, nextBtn, addForm, ul);
      grid.appendChild(card);
    }
  }

  // ── Rename topic inline ──
  function startRename(topic, titleSpan) {
    const input = document.createElement("input");
    input.type = "text";
    input.className = "topic-title-input";
    input.value = topic.name;
    input.maxLength = 80;
    titleSpan.replaceWith(input);
    input.focus();
    input.select();

    const save = async () => {
      const newName = input.value.trim();
      if (newName && newName !== topic.name) {
        await supabase.from("hosting_topics").update({ name: newName }).eq("id", topic.id);
      } else {
        loadHosting();
      }
    };

    input.addEventListener("blur", save);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); input.blur(); }
      if (e.key === "Escape") { input.value = topic.name; input.blur(); }
    });
  }

  // ── Delete topic ──
  async function deleteTopic(id, name) {
    if (!confirm(`Delete topic "${name}" and all its names?`)) return;
    const { error } = await supabase.from("hosting_topics").delete().eq("id", id);
    if (error) alert("Couldn't delete topic: " + error.message);
  }

  // ── Add name ──
  async function addName(topicId, name, topicNames) {
    const maxPos = topicNames.length > 0
      ? Math.max(...topicNames.map(n => n.position))
      : -1;
    const isFirst = topicNames.length === 0;
    const { error } = await supabase.from("hosting_names").insert({
      topic_id: topicId,
      name,
      position: maxPos + 1,
      is_current: isFirst   // first name auto-becomes current
    });
    if (error) alert("Couldn't add name: " + error.message);
  }

  // ── Delete name ──
  async function deleteName(id) {
    const { error } = await supabase.from("hosting_names").delete().eq("id", id);
    if (error) alert("Couldn't remove name: " + error.message);
  }

  // ── Advance to next host ──
  async function advanceNext(topicId) {
    const topicNames = getNamesForTopic(topicId);
    if (topicNames.length === 0) return;

    const currentIdx = topicNames.findIndex(n => n.is_current);
    const nextIdx = (currentIdx + 1) % topicNames.length;  // wraps around; -1+1=0 if none set

    // Clear all current flags for this topic then set the next one
    const { error: clearErr } = await supabase
      .from("hosting_names")
      .update({ is_current: false })
      .eq("topic_id", topicId);
    if (clearErr) { alert("Error: " + clearErr.message); return; }

    const { error: setErr } = await supabase
      .from("hosting_names")
      .update({ is_current: true })
      .eq("id", topicNames[nextIdx].id);
    if (setErr) alert("Error: " + setErr.message);
  }

  // ── Move name up or down ──
  async function moveName(nameId, direction, topicId) {
    const topicNames = getNamesForTopic(topicId);
    const idx = topicNames.findIndex(n => n.id === nameId);
    if (idx === -1) return;

    const swapIdx = direction === "up" ? idx - 1 : idx + 1;
    if (swapIdx < 0 || swapIdx >= topicNames.length) return;

    const curr = topicNames[idx];
    const swap = topicNames[swapIdx];

    // Swap position values
    const [r1, r2] = await Promise.all([
      supabase.from("hosting_names").update({ position: swap.position }).eq("id", curr.id),
      supabase.from("hosting_names").update({ position: curr.position }).eq("id", swap.id)
    ]);
    if (r1.error) alert("Error: " + r1.error.message);
    if (r2.error) alert("Error: " + r2.error.message);
  }

  // ── Load hosting data ──
  async function loadHosting() {
    const [{ data: topicsData, error: tErr }, { data: namesData, error: nErr }] =
      await Promise.all([
        supabase.from("hosting_topics").select("*").order("created_at", { ascending: true }),
        supabase.from("hosting_names").select("*").order("position", { ascending: true })
      ]);

    if (tErr || nErr) {
      console.error("Hosting load error:", tErr || nErr);
      return;
    }
    topics = topicsData || [];
    names  = namesData  || [];
    renderHosting();
  }

  // ── New topic form ──
  document.getElementById("newTopicForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const input = document.getElementById("newTopicInput");
    const name = input.value.trim();
    if (!name) return;
    input.value = "";
    const { error } = await supabase.from("hosting_topics").insert({ name });
    if (error) alert("Couldn't create topic: " + error.message);
  });

  // ── Realtime subscriptions ──
  function subscribe() {
    supabase
      .channel("ideas-changes")
      .on("postgres_changes", { event: "*", schema: "public", table: "ideas" }, () => loadIdeas())
      .subscribe();

    supabase
      .channel("hosting-changes")
      .on("postgres_changes", { event: "*", schema: "public", table: "hosting_topics" }, () => loadHosting())
      .on("postgres_changes", { event: "*", schema: "public", table: "hosting_names" },  () => loadHosting())
      .subscribe();
  }

  // ── Boot ──
  if (!SUPABASE_URL.startsWith("YOUR_") && !SUPABASE_ANON_KEY.startsWith("YOUR_")) {
    loadIdeas();
    loadHosting();
    subscribe();
  } else {
    drawWheel();
    renderHosting();
  }
</script>
</body>
</html>
